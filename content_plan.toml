# Monthly content plan for the HDH workbook automation.
#
# Giusi fills this in a few editions ahead. The monthly cron looks up the entry
# for the current month (key format: "YYYY-MM") and generates that workbook.
# If there's no entry for the current month, the job emails a heads-up and stops
# (it never invents a theme on its own).
#
# Each entry needs:
#   tema       — the core theme of the month
#   obiettivi  — what participants should experience / take away
# The edition label shown on the cover is derived automatically (e.g. "Luglio 2026").
#
# Cross-check source: the "CLAUDE Skill - Onboarding_Giusis Business" Google Doc
# (see brand_voice/sources.md, second URL) also carries a "Temi mensili 2026" line
# with short theme labels per month. The generate-workbook skill checks this file
# against that line on every run and stops if they clearly disagree, instead of
# silently picking one — see SKILL.md step 1.
#
# 2026-08 reconciled 2026-08-14: this file previously had "il riposo come atto
# di potere" for August, which conflicted with the Doc's "Agosto = Digital
# Detox". Confirmed with Giusi that Digital Detox is correct; entry below
# updated to match.

["2026-07"]
tema = "la femminilità e la sensualità come forza vitale"
obiettivi = "riconnettersi al proprio corpo e alla propria energia femminile, oltre gli standard esterni"

["2026-08"]
tema = "la disconnessione digitale come atto di presenza e di ritorno a sé"
obiettivi = "imparare a staccarsi dagli schermi senza sensi di colpa, riconoscere quanto tempo, attenzione e presenza vengono sottratti dal rumore digitale, e riappropriarsi del proprio tempo e della propria vita reale"
